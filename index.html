<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerebro - AI Learning Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="py-3">
        <div class="container">
            <div class="d-flex align-items-center gap-3">
                <img src="assets/logo.png" alt="Cerebro Logo" class="logo">
                <div>
                    <h1 class="h4 mb-0 fw-bold text-dark">Cerebro</h1>
                    <p class="text-muted small mb-0">AI Learning Intelligence Platform</p>
                </div>
            </div>
        </div>
    </header>

    <main class="container py-5">
        <div class="welcome-card p-5 text-center">
            <h2 class="h2 fw-bold text-dark mb-3">Welcome to Cerebro!</h2>
            <p class="lead text-muted">
                Your intelligent learning companion powered by advanced algorithms and AI.
            </p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
